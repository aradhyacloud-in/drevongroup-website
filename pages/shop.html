<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wooden Toys Shop | Drevon Group</title>

  <!-- Shop-specific CSS -->
  <link rel="stylesheet" href="../css/shop.css">
</head>

<body>

  <!-- HERO SECTION -->
  <section class="shop-hero">
    <h1>Premium Wooden Toys Store</h1>
    <p>Eco-friendly handcrafted toys for children - Made in India </p>
  </section>
  <div class="shop-search">
    <input type="text" id="searchInput" placeholder="Search wooden toys...">
  </div>
  
  <!-- CATEGORY FILTERS -->
  <section class="category-filters"></section>

  <!-- PRODUCT GRID -->
  <section id="productGrid"></section>

  <!-- CTA SECTION -->
  <section class="shop-cta">
    <h2>Need Bulk Orders or Custom Requirements?</h2>
    <a href="../pages/business-enquiry.html" class="cta-btn">
      Go to Business Enquiry
    </a>
  </section>

  <!-- SHOP SCRIPT -->
  <script src="../js/shop.js"></script>
  
  <!-- PRODUCT VIEWER (DRAWER LOGIC) -->
  <script src="../js/product-viewer.js"></script>

  <!-- PRODUCT DRAWER OVERLAY -->
  <div id="productDrawerOverlay" class="drawer-overlay"></div>
  
  <!-- PRODUCT DRAWER PANEL -->
  <div id="productDrawer" class="product-drawer">
  
    <div class="drawer-close" onclick="closeDrawer()">✕</div>
  
    <div id="drawerContent">
    <!-- Dynamic product content will load here -->
    </div>
  
  </div>
</body>

</html>
